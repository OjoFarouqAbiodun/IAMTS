<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | ICT Assets Maintenance &amp; Tracking System</title>
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="/assets/vendor/fontawesome/css/all.min.css"
      integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="login-container">
      <section class="login-form-section">
        <div class="login-form-inner">
          <div class="form-brand">
            <img
              class="form-logo"
              src="assets/images/mist-logo.jpg"
              alt="IAMTS logo"
            />
            <div class="form-brand-text">
              <h2>IAMTS</h2>
              <p>ICT Assets Maintenance &amp; Tracking System</p>
            </div>
          </div>

          <h1>Reset your password</h1>
          <p class="form-subtitle">Choose a new password for your account</p>

          <div id="resetAlert" class="login-alert" role="alert" hidden></div>

          <form id="resetForm" novalidate>
            <label class="field-label" for="newPassword">New Password</label>
            <div class="input-group">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                id="newPassword"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                required
              />
              <i class="fa-solid fa-eye eye-icon"></i>
            </div>

            <label class="field-label" for="confirmPassword">
              Confirm Password
            </label>
            <div class="input-group">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter your new password"
                autocomplete="new-password"
                required
              />
            </div>

            <button type="submit" class="btn-signin" id="resetSubmitBtn">
              <i class="fa-solid fa-key"></i>
              Reset Password
            </button>
          </form>

          <p class="forgot-link" style="text-align: center; margin-top: 24px">
            <a href="/login.html">Back to sign in</a>
          </p>

          <footer class="form-footer">
            © 2026 Lagos State Ministry of Innovation, Science and Technology
          </footer>
        </div>
      </section>
    </div>

    <script src="assets/js/reset-password.js"></script>
    <script src="assets/js/csrf.js"></script>
  </body>
</html>
